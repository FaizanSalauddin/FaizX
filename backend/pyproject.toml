[project]
name = "backend"
version = "0.1.0"
description = "FaizX AI Portfolio Backend"
readme = "README.md"
authors = [
    { name = "Faizan Salauddin", email = "salauddinfaizan@gmail.com" }
]
requires-python = ">=3.12"

dependencies = [
    "fastapi>=0.141.1",
    "groq>=1.7.0",
    "pydantic>=2.13.5",
    "pypdf>=6.18.1",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.3",
    "python-multipart>=0.0.32",
    "uvicorn>=0.53.0",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"